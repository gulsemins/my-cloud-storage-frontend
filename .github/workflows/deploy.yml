name: Deploy Cloud Storage Frontend to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-cloud-storage-frontend:latest
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/my-cloud-storage-frontend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-cloud-storage-frontend:latest
            docker stop cloud-storage-frontend || true
            docker rm cloud-storage-frontend || true
            docker run -d \
              --name cloud-storage-frontend \
              -p 8083:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-cloud-storage-frontend:latest
